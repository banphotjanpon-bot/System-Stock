<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจัดการสต็อกยา</title>
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--bg:#f3f6f8;--card:#fff;--tx:#14202b;--mu:#64748b;--bd:#e2e8f0;--pr:#0f766e;--prt:#fff;--prs:#ccfbf1;--ok:#15803d;--okb:#dcfce7;--wn:#b45309;--wnb:#fef3c7;--er:#b91c1c;--erb:#fee2e2;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1418;--card:#162028;--tx:#e8eef3;--mu:#93a4b3;--bd:#26343f;--pr:#2dd4bf;--prt:#042f2e;--prs:#134e4a;--ok:#4ade80;--okb:#12301d;--wn:#fbbf24;--wnb:#3a2c0b;--er:#f87171;--erb:#3b1517;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:240px;background:linear-gradient(135deg,var(--pr),#0ea5e9);opacity:.10;z-index:-1}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 40px}
/* header */
.hdr{position:sticky;top:8px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:10px 14px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;flex:none;border-radius:12px;background:var(--prs);display:grid;place-items:center;font-size:21px}
.logo.big{width:64px;height:64px;font-size:32px;border-radius:18px;margin:0 auto 12px}
.bn{font-weight:700;font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{color:var(--mu);font-size:12px}
.usr{display:flex;align-items:center;gap:8px}.usr small{color:var(--mu)}
.av{width:34px;height:34px;border-radius:50%;background:var(--pr);color:var(--prt);display:grid;place-items:center;font-weight:700}
/* buttons & inputs */
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer;transition:border-color .15s,filter .15s}
button:hover{border-color:var(--pr);color:var(--pr)}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}button.pri:hover{filter:brightness(1.08);color:var(--prt)}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;min-width:0}
input:focus,select:focus{outline:2px solid var(--pr);outline-offset:-1px;border-color:var(--pr)}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu);font-weight:500}
.lnk{background:none;border:none;color:var(--pr);padding:6px 0}
/* tabs */
.tabs{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:12px}
.tab.on{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
.tab.on:hover{color:var(--prt)}
/* alert */
.alert{background:var(--erb);color:var(--er);border:1px solid var(--er);border-left-width:5px;border-radius:12px;padding:12px 14px;margin:0 0 14px;display:none;line-height:1.7}
.alert b{display:block;margin-bottom:2px}
/* toolbar */
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar input:not([type=checkbox]){flex:1;min-width:150px}
/* item cards */
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh)}
.card.st-ok{border-left-color:var(--ok)}.card.st-low{border-left-color:var(--wn)}.card.st-out{border-left-color:var(--er)}
.nm{flex:1;min-width:170px}.nm b{font-size:16px}.nm small{display:block;color:var(--mu);font-size:13px}
.qty{font-size:22px;font-weight:700;min-width:90px;text-align:right}
.badge{font-size:12px;border-radius:99px;padding:2px 10px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--okb);color:var(--ok)}.badge.low{background:var(--wnb);color:var(--wn)}.badge.out{background:var(--erb);color:var(--er)}
.act{display:flex;gap:6px;flex-wrap:wrap}.act button{padding:6px 11px;font-size:13px}
.act button[data-m="in"]{color:var(--ok);background:var(--okb);border-color:transparent}
.act button[data-m="out"]{color:var(--er);background:var(--erb);border-color:transparent}
.low-t{color:var(--wn);font-weight:600}.out-t{color:var(--er);font-weight:600}
/* log table */
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:12px;background:var(--bg)}
tbody tr:hover{background:var(--bg)}tbody tr:last-child td{border-bottom:none}
.pill{font-size:12px;border-radius:99px;padding:2px 10px;font-weight:600}
.pill.in{background:var(--okb);color:var(--ok)}.pill.out{background:var(--erb);color:var(--er)}.pill.adjust{background:var(--wnb);color:var(--wn)}
.in{color:var(--ok)}.outc{color:var(--er)}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px 12px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pr)}
.kpi.low::before{background:var(--wn)}.kpi.out::before,.kpi.dn::before{background:var(--er)}.kpi.up::before{background:var(--ok)}
.kpi small{color:var(--mu);display:block;font-size:12px}.kpi b{font-size:26px;font-weight:700;line-height:1.25}
.kpi.low b{color:var(--wn)}.kpi.out b,.kpi.dn b{color:var(--er)}.kpi.up b{color:var(--ok)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.panel h3{margin:0 0 12px;font-size:15px;font-weight:600}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}.two>.panel{margin-bottom:0}
.chart{display:flex;gap:8px;height:170px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars{flex:1;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center;border-bottom:1px solid var(--bd)}
.b{display:block;width:40%;max-width:26px;min-height:2px;border-radius:4px 4px 0 0}
.b.gi{background:var(--ok)}.b.go{background:var(--er)}
.col small{font-size:11px;color:var(--mu);margin-top:6px}
.leg{font-size:12px;color:var(--mu);margin-top:10px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px}
.trow{display:flex;align-items:center;gap:8px;margin:8px 0}.trow span:first-child{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar{flex:1;background:var(--bg);border-radius:6px;height:10px}.tbar i{display:block;height:100%;background:var(--pr);border-radius:6px}
.msg{color:var(--mu);text-align:center;padding:22px 10px}.err{color:var(--er);margin-top:8px;min-height:1em;font-size:14px}
/* dialogs */
dialog{border:none;border-radius:18px;background:var(--card);color:var(--tx);width:min(92vw,420px);max-height:90vh;overflow-y:auto;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,23,42,.5);backdrop-filter:blur(2px)}
dialog h3{font-size:18px}
dialog input,dialog select,#login input,#onboard input{width:100%}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
#qImg svg{width:220px;height:220px;display:block}
/* login / onboarding */
#login,#onboard{max-width:390px;margin:9vh auto 0;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:28px 26px;box-shadow:0 12px 40px rgba(15,23,42,.12)}
#login h1,#onboard h1{font-size:21px;margin:0 0 4px;text-align:center}
#login .tag{color:var(--mu);text-align:center;margin:0 0 14px;font-size:14px}
#login button,#onboard button{width:100%;margin-top:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){
  .wrap{padding:8px 12px 96px}
  #who{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);z-index:30;justify-content:space-around;overflow:visible}
  .tab{flex:1;flex-direction:column;gap:1px;font-size:12px;padding:6px 4px;border:none;background:none;justify-content:center}
  .tab.on{background:var(--prs);color:var(--pr)}.tab.on:hover{color:var(--pr)}
  .act{width:100%}.act button{flex:1}
  .qty{min-width:0;margin-left:auto}
}
</style>
</head>
<body>

<!-- หน้าล็อกอิน -->
<div id="login" hidden>
  <div class="logo big">💊</div>
  <h1>ระบบจัดการสต็อกยา</h1>
  <p class="tag">รับเข้า · จ่ายออก · ติดตามวันหมดอายุ</p>
  <div id="sFields" hidden>
    <label>ชื่อ-นามสกุล</label><input id="lName" autocomplete="name">
    <label>เบอร์โทร</label><input id="lPhone" type="tel" autocomplete="tel" inputmode="tel">
  </div>
  <label>อีเมล</label><input id="lEmail" type="email" autocomplete="username">
  <label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input id="lPass" type="password" autocomplete="current-password">
  <button class="pri" id="lGo">เข้าสู่ระบบ</button>
  <button class="lnk" id="lSw">ยังไม่มีบัญชี? สมัครใช้งาน</button>
  <div class="err" id="lErr"></div>
</div>

<!-- เลือกร้าน -->
<div id="onboard" hidden>
  <h1>🏪 ตั้งค่าร้าน</h1>
  <div style="color:var(--mu);margin-bottom:8px">คุณยังไม่ได้อยู่ในร้านใด เลือกอย่างใดอย่างหนึ่ง</div>
  <label>สร้างร้านใหม่ (คุณเป็นเจ้าของ)</label><input id="oName" placeholder="ชื่อร้าน / ทีม">
  <button class="pri" id="oCreate">สร้างร้าน</button>
  <hr style="border:none;border-top:1px solid var(--bd);margin:16px 0 0">
  <label>หรือเข้าร่วมร้านที่มีอยู่ด้วยรหัสเชิญ</label><input id="oCode" placeholder="เช่น A1B2C3D4" style="text-transform:uppercase">
  <button id="oJoin">เข้าร่วม</button>
  <button class="lnk" id="oOut">ออกจากระบบ</button>
  <div class="err" id="oErr"></div>
</div>

<!-- หน้าหลัก -->
<div class="wrap" id="app" hidden>
  <header class="hdr">
    <div class="brand"><span class="logo">💊</span><div style="min-width:0"><div class="bn" id="shopName">ระบบจัดการสต็อกยา</div><small>ระบบจัดการสต็อกยา</small></div></div>
    <div class="usr"><small id="who"></small><span class="av" id="av">?</span><button id="out">ออกจากระบบ</button></div>
  </header>
  <div id="alert" class="alert"></div>
  <div class="tabs"><button class="tab on" data-t="dash"><span>📊</span>แดชบอร์ด</button><button class="tab" data-t="stock"><span>💊</span>สินค้า</button><button class="tab" data-t="log"><span>🧾</span>ประวัติ</button><button class="tab" data-t="team" id="teamTab" hidden><span>👥</span>ทีม</button></div>

  <section id="dash"></section>

  <section id="stock" hidden>
    <div class="bar"><input id="q" placeholder="ค้นหาชื่อ / รหัสสินค้า"><select id="flt"><option value="all">ทั้งหมด</option><option value="low">ใกล้หมด/หมด</option><option value="exp">ใกล้หมดอายุ/หมดอายุ</option></select><label style="display:flex;align-items:center;gap:4px;margin:0;color:var(--tx)"><input type="checkbox" id="showOff" style="width:auto;flex:none">ปิดใช้งาน</label><button id="expStock">⬇ CSV</button><button class="pri" id="add">+ เพิ่มสินค้า</button></div>
    <div id="list"><div class="msg">กำลังโหลด...</div></div>
  </section>
  <section id="team" hidden></section>

  <section id="log" hidden>
    <div class="bar"><input id="lq" placeholder="ค้นหาในประวัติ"><select id="lt"><option value="all">ทุกประเภท</option><option value="in">รับเข้า</option><option value="out">จ่ายออก</option><option value="adjust">ปรับยอด</option></select><button id="expLog">⬇ CSV</button></div>
    <div class="scroll"><table><thead><tr><th>เวลา</th><th>สินค้า</th><th>ประเภท</th><th>จำนวน</th><th>คงเหลือ</th><th>ผู้ทำรายการ</th><th>หมายเหตุ</th></tr></thead><tbody id="lb"></tbody></table></div>
  </section>
</div>

<dialog id="dNew"><h3 style="margin:0">เพิ่มสินค้า</h3>
  <label>ชื่อสินค้า</label><input id="nName"><label>รหัส (SKU)</label><input id="nSku">
  <label>หน่วย</label><select id="nUnit"><option>ชิ้น</option><option>เม็ด</option><option>อัน</option><option>แพ็ค</option><option>กล่อง</option></select><label>จำนวนเริ่มต้น (ล็อตแรก)</label><input id="nQty" type="number" min="0" value="0" inputmode="numeric">
  <label>แจ้งเตือนเมื่อเหลือ ≤</label><input id="nMin" type="number" min="0" value="5" inputmode="numeric">
  <label>ตำแหน่งที่วาง</label><input id="nLoc" placeholder="เช่น ตู้ A ชั้น 2">
  <label>วันหมดอายุ ล็อตแรก</label><input id="nE1" type="date">
  <label>วันหมดอายุ ล็อตที่ 2 (รับมาใหม่)</label><input id="nE2" type="date">
  <label>จำนวนล็อตที่ 2</label><input id="nQ2" type="number" min="0" value="0" inputmode="numeric">
  <div class="err" id="nErr"></div>
  <div class="row"><button id="nCancel">ยกเลิก</button><button class="pri" id="nOk">บันทึก</button></div></dialog>

<dialog id="dEdit"><h3 style="margin:0">แก้ไขสินค้า</h3>
  <label>ชื่อสินค้า</label><input id="eName"><label>รหัส (SKU)</label><input id="eSku">
  <label>หน่วย</label><select id="eUnit"><option>ชิ้น</option><option>เม็ด</option><option>อัน</option><option>แพ็ค</option><option>กล่อง</option></select><label>แจ้งเตือนเมื่อเหลือ ≤</label><input id="eMin" type="number" min="0" inputmode="numeric">
  <label>ตำแหน่งที่วาง</label><input id="eLoc" placeholder="เช่น ตู้ A ชั้น 2">
  <label>วันหมดอายุ ล็อตแรก</label><input id="eE1" type="date">
  <label>จำนวนล็อตแรก</label><input id="eQ1" type="number" min="0" inputmode="numeric">
  <label>วันหมดอายุ ล็อตที่ 2 (รับมาใหม่)</label><input id="eE2" type="date">
  <label>จำนวนล็อตที่ 2</label><input id="eQ2" type="number" min="0" inputmode="numeric">
  <div class="err" id="eErr"></div>
  <div class="row" style="justify-content:space-between;flex-wrap:wrap"><button id="eToggle"></button><span style="display:flex;gap:8px"><button id="eCancel">ยกเลิก</button><button class="pri" id="eOk">บันทึก</button></span></div></dialog>

<dialog id="dQR" style="text-align:center"><h3 style="margin:0" id="qName"></h3><div id="qCode" style="color:var(--mu);margin:4px 0 10px"></div>
  <div id="qImg" style="background:#fff;display:inline-block;padding:10px;border-radius:8px"></div>
  <div class="row" style="justify-content:center"><button id="qPrint">พิมพ์</button><button class="pri" id="qClose">ปิด</button></div></dialog>

<dialog id="dMove"><h3 style="margin:0" id="mTitle"></h3><div id="mCur" style="color:var(--mu)"></div>
  <label id="mQtyL">จำนวน</label><input id="mQty" type="number" min="1" inputmode="numeric">
  <div id="mReasonW" hidden><label>เหตุผล</label><select id="mReason"><option>นับสต็อกจริงไม่ตรง</option><option>ของเสีย/ชำรุด</option><option>สูญหาย</option><option>อื่น ๆ</option></select></div>
  <div id="mExpW" hidden><label>วันหมดอายุของล็อตที่รับเข้า (ถ้ามี)</label><input id="mExp" type="date"></div>
  <label>หมายเหตุ (ถ้ามี)</label><input id="mNote">
  <div class="err" id="mErr"></div>
  <div class="row"><button id="mCancel">ยกเลิก</button><button class="pri" id="mOk">ยืนยัน</button></div></dialog>

<script>
// ===== ตั้งค่า: ใส่ค่าจาก Supabase > Project Settings > API =====
const SUPABASE_URL = "https://nzwdfmgshvufcschtzro.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_k-y1rUJ9sWJ6dhR5IfGsdQ_GQR52W5L"; // ใช้ anon key เท่านั้น ห้ามใส่ service_role
// =================================================================

const NOT_CONFIGURED = SUPABASE_URL.includes("YOUR-PROJECT") || SUPABASE_ANON_KEY.startsWith("YOUR-");
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => Number(n).toLocaleString("th-TH");
const stat = i => i.qty <= 0 ? "out" : i.qty <= i.min_qty ? "low" : "ok";
let shop = null, allItems = [], items = [], logs = [], mv = null, signup = false, channel = null, started = false, busy = false;

/* ---------- Auth ---------- */
function setMode(v) {
  signup = v;
  $("#lGo").textContent = signup ? "สมัครใช้งาน" : "เข้าสู่ระบบ";
  $("#lSw").textContent = signup ? "มีบัญชีแล้ว? เข้าสู่ระบบ" : "ยังไม่มีบัญชี? สมัครใช้งาน";
  $("#sFields").hidden = !signup;
  $("#lPass").autocomplete = signup ? "new-password" : "current-password";
  $("#lErr").textContent = ""; $("#lErr").style.color = "";
}
$("#lSw").onclick = () => setMode(!signup);
$("#lGo").onclick = async () => {
  const email = $("#lEmail").value.trim(), password = $("#lPass").value;
  $("#lErr").textContent = ""; $("#lErr").style.color = "";
  const full_name = $("#lName").value.trim(), phone = $("#lPhone").value.trim();
  if (signup && !full_name) { $("#lErr").textContent = "กรุณากรอกชื่อ-นามสกุล"; return; }
  if (!email || password.length < 6) { $("#lErr").textContent = "กรอกอีเมล และรหัสผ่านอย่างน้อย 6 ตัว"; return; }
  if (NOT_CONFIGURED) { $("#lErr").textContent = "ยังไม่ได้ใส่ SUPABASE_URL / SUPABASE_ANON_KEY ในไฟล์ index.html"; return; }
  $("#lGo").disabled = true; busy = signup;
  const { data, error } = signup ? await sb.auth.signUp({ email, password, options: { data: { full_name, phone } } }) : await sb.auth.signInWithPassword({ email, password });
  $("#lGo").disabled = false;
  if (error) { busy = false; $("#lErr").textContent = /fetch/i.test(error.message) ? "เชื่อมต่อ Supabase ไม่ได้ ตรวจ URL/คีย์ในไฟล์ และดูว่าโปรเจกต์ไม่ได้ถูก pause" : error.message; return; }
  if (signup) {
    const hadSession = !!data.session;
    if (hadSession) await sb.auth.signOut();
    busy = false;
    const em = $("#lEmail").value;
    setMode(false);
    $("#lEmail").value = em; $("#lPass").value = ""; $("#lName").value = ""; $("#lPhone").value = "";
    $("#login").hidden = false; $("#app").hidden = true;
    $("#lErr").style.color = "var(--ok)";
    $("#lErr").textContent = hadSession ? "สมัครสมาชิกสำเร็จ กรุณาเข้าสู่ระบบ" : "สมัครสำเร็จ กรุณายืนยันอีเมลก่อน แล้วเข้าสู่ระบบ";
  }
};
$("#lPass").onkeydown = e => { if (e.key === "Enter") $("#lGo").click(); };
$("#out").onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange((_e, session) => {
  if (busy && session) return;
  const on = !!session;
  $("#login").hidden = on; if (!on) { $("#app").hidden = true; $("#onboard").hidden = true; }
  if (on) { $("#who").textContent = (session.user.user_metadata && session.user.user_metadata.full_name) || session.user.email; if (!started) { started = true; boot(); } }
  else { started = false; if (channel) { sb.removeChannel(channel); channel = null; } shop = null; allItems = []; items = []; logs = []; }
});

/* ---------- Data ---------- */
async function load() {
  const [a, b] = await Promise.all([
    sb.from("items").select("*").order("name"),
    sb.from("stock_logs").select("*").order("created_at", { ascending: false }).limit(1000)
  ]);
  if (a.error) { $("#list").innerHTML = '<div class="msg">โหลดไม่สำเร็จ: ' + esc(a.error.message) + '</div>'; return; }
  allItems = a.data; items = allItems.filter(i => i.active !== false); logs = b.data || [];
  renderAll();
}
function listen() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("stock")
    .on("postgres_changes", { event: "*", schema: "public", table: "items" }, load)
    .on("postgres_changes", { event: "*", schema: "public", table: "stock_logs" }, load)
    .subscribe();
}

  const day0 = new Date(); day0.setHours(0, 0, 0, 0);
  const days = [];
  for (let k = 6; k >= 0; k--) {
    const d = new Date(day0); d.setDate(d.getDate() - k);
    const e = new Date(d); e.setDate(e.getDate() + 1);
    const ls = logs.filter(l => { const t = new Date(l.created_at); return t >= d && t < e; });

      <div class="kpi low"><small>ใกล้หมด</small><b>${num(low)}</b></div>
      <div class="kpi out"><small>หมดแล้ว</small><b>${num(out)}</b></div>
      <div class="kpi low"><small>ใกล้หมดอายุ</small><b>${num(items.filter(i => expState(i) === "low").length)}</b><small>${expQtySum("low")}</small></div>
      <div class="kpi out"><small>หมดอายุแล้ว</small><b>${num(items.filter(i => expState(i) === "out").length)}</b><small>${expQtySum("out")}</small></div>
      <div class="kpi up"><small>รับเข้าวันนี้</small><b>+${num(today.i)}</b></div>
      <div class="kpi dn"><small>จ่ายออกวันนี้</small><b>−${num(today.o)}</b></div>
    </div>
    <div class="panel"><h3>รับเข้า / จ่ายออก 7 วันล่าสุด</h3>
      <div class="chart">${days.map(d => `<div class="col"><div class="bars"><i class="b gi" style="height:${d.i / max * 100}%" title="รับเข้า ${d.i}"></i><i class="b go" style="height:${d.o / max * 100}%" title="จ่ายออก ${d.o}"></i></div><small>${d.label}</small></div>`).join("")}</div>

      <div class="panel"><h3>ต้องสั่งเพิ่ม</h3>${bad.length ? bad.map(i => `<div class="trow"><span>${esc(i.name)}</span><span class="badge ${stat(i)}" style="width:auto">${i.qty <= 0 ? "หมด" : "เหลือ " + num(i.qty)}</span></div>`).join("") : '<div class="msg">สต็อกปกติทุกรายการ</div>'}</div>
    </div>

/* ---------- Expiry ---------- */
const EXP_WARN = 90; // แจ้งเตือนล่วงหน้า (วัน)
const DATE_MSG = "ปีของวันหมดอายุไม่สมเหตุสมผล กรุณาเลือกวันจากปฏิทิน ไม่ต้องพิมพ์ปีเอง";
function badDate(v) { if (!v) return false; const y = +v.slice(0, 4), n = new Date().getFullYear(); return y < n - 5 || y > n + 30; }
document.querySelectorAll('input[type=date]').forEach(el => { const n = new Date().getFullYear(); el.min = (n - 5) + "-01-01"; el.max = (n + 30) + "-12-31"; });
function dleft(d) { if (!d) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((new Date(d + "T00:00:00") - t) / 86400000); }
const eState = d => { const n = dleft(d); return n === null ? "ok" : n < 0 ? "out" : n <= EXP_WARN ? "low" : "ok"; };
const eRank = { ok: 0, low: 1, out: 2 };
const expState = i => [i.exp1, i.exp2].map(eState).reduce((a, b) => eRank[b] > eRank[a] ? b : a, "ok");
const minExp = i => [i.exp1, i.exp2].filter(Boolean).sort()[0] || "9999";
const fmtD = d => d ? new Date(d + "T00:00:00").toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" }) : "-";
function expTxt(d) { const st = eState(d), n = dleft(d); return fmtD(d) + (badDate(d) ? " ⚠️ ตรวจปี" : "") + (st === "out" ? " (หมดอายุแล้ว)" : st === "low" ? " (อีก " + n + " วัน)" : ""); }
const lots = i => [{ n: 1, d: i.exp1, q: i.lot1_qty || 0 }, { n: 2, d: i.exp2, q: i.lot2_qty || 0 }].filter(l => l.d);
const qtxt = (l, u) => l.q > 0 ? " · " + num(l.q) + " " + u : "";
const expSummary = i => lots(i).filter(l => eState(l.d) !== "ok").map(l => "ล็อต " + l.n + " " + expTxt(l.d) + qtxt(l, i.unit)).join(", ");
const nearTxt = i => { const l = lots(i).sort((x, y) => x.d.localeCompare(y.d))[0]; return expTxt(l.d) + qtxt(l, i.unit); };
const unitOf = id => (allItems.find(x => x.id === id) || {}).unit || "";
function expQtySum(state) {
  const m = {};
  items.forEach(i => lots(i).forEach(l => { if (eState(l.d) === state && l.q > 0) m[i.unit] = (m[i.unit] || 0) + l.q; }));
  const e = Object.entries(m).map(([u, q]) => num(q) + " " + u);
  return e.length ? "รวม " + e.join(" · ") : "";
}
const locLine = i => i.location ? `<small>📍 ${esc(i.location)}</small>` : "";
const expLine = i => lots(i).length ? `<small>หมดอายุ: ${lots(i).map(l => `ล็อต ${l.n} <span class="${eState(l.d)}-t">${expTxt(l.d)}${qtxt(l, i.unit)}</span>`).join(" · ")}</small>` : "";

/* ---------- QR ---------- */
function qrSvg(text) {
  if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs["UTF-8"]) qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag(6, 0);
}
let qItem = null;
function qPayload(i) { return i.sku || i.id; }
function openQR(id) {
  const i = allItems.find(x => x.id === id); if (!i) return; qItem = i;
  $("#qName").textContent = i.name; $("#qCode").textContent = qPayload(i);
  $("#qImg").innerHTML = qrSvg(qPayload(i)); $("#dQR").showModal();
}
$("#qClose").onclick = () => $("#dQR").close();
$("#qPrint").onclick = () => {
  const w = window.open("", "_blank"); if (!w) return;
  w.document.write("<title>QR</title><style>svg{width:260px;height:260px}</style><body style='text-align:center;font-family:sans-serif'><h3>" + esc(qItem.name) + "</h3>" + qrSvg(qPayload(qItem)) + "<p>" + esc(qPayload(qItem)) + "</p><script>onload=()=>print()<\/script>");
  w.document.close();
};

/* ---------- Shop / team ---------- */
const isOwner = () => !!shop && shop.srole === "owner";
async function boot() {
  const { data, error } = await sb.rpc("my_shop");
  if (error) { started = false; alert("โหลดข้อมูลร้านไม่สำเร็จ: " + error.message + "\n(ตรวจว่ารัน team.sql แล้ว)"); return; }
  shop = (data && data[0]) || null;
  if (!shop) { started = false; $("#app").hidden = true; $("#onboard").hidden = false; return; }
  started = true;
  $("#onboard").hidden = true; $("#app").hidden = false;
  $("#shopName").textContent = shop.sname + (isOwner() ? "" : " (พนักงาน)");
  $("#add").hidden = !isOwner(); $("#teamTab").hidden = !isOwner();
  $("#av").textContent = ($("#who").textContent || "?").trim().charAt(0).toUpperCase();
  load(); listen();
}
async function onboardGo(fn, args) {
  $("#oErr").textContent = "";
  const { error } = await sb.rpc(fn, args);
  if (error) { $("#oErr").textContent = error.message.includes("invalid code") ? "รหัสเชิญไม่ถูกต้อง" : error.message; return; }
  boot();
}
$("#oCreate").onclick = () => { const n = $("#oName").value.trim(); if (!n) { $("#oErr").textContent = "กรุณากรอกชื่อร้าน"; return; } onboardGo("create_shop", { p_name: n }); };
$("#oJoin").onclick = () => { const c = $("#oCode").value.trim(); if (!c) { $("#oErr").textContent = "กรุณากรอกรหัสเชิญ"; return; } onboardGo("join_shop", { p_code: c }); };
$("#oOut").onclick = () => sb.auth.signOut();

async function renderTeam() {
  if (!isOwner()) return;
  const el = $("#team");
  el.innerHTML = '<div class="msg">กำลังโหลด...</div>';
  const { data, error } = await sb.rpc("shop_team");
  if (error) { el.innerHTML = '<div class="msg">โหลดไม่สำเร็จ: ' + esc(error.message) + '</div>'; return; }
  el.innerHTML = `<div class="panel"><h3>รหัสเชิญเข้าร้าน</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><b style="font-size:22px;letter-spacing:2px">${esc(shop.scode)}</b><button id="cpCode">คัดลอก</button><button id="rgCode">สร้างรหัสใหม่</button></div>
    <div class="leg">ให้พนักงานสมัครสมาชิก แล้วกรอกรหัสนี้เพื่อเข้าร่วม สิทธิ์พนักงาน: ดูข้อมูล รับเข้า/จ่ายออก</div></div>
    <div class="panel"><h3>สมาชิก (${data.length})</h3>${data.map(m => `<div class="trow"><span style="width:auto;flex:1">${esc(m.m_name || m.m_email || "-")} <small style="color:var(--mu)">${esc(m.m_email || "")}</small></span><span class="badge ${m.m_role === "owner" ? "ok" : "low"}" style="width:auto">${m.m_role === "owner" ? "เจ้าของ" : "พนักงาน"}</span>${m.m_role === "staff" ? `<button data-rm="${m.m_id}">ลบ</button>` : ""}</div>`).join("")}</div>`;
  $("#cpCode").onclick = async () => { try { await navigator.clipboard.writeText(shop.scode); $("#cpCode").textContent = "คัดลอกแล้ว"; } catch (e) {} };
  $("#rgCode").onclick = async () => { if (!confirm("สร้างรหัสใหม่? รหัสเดิมจะใช้ไม่ได้อีก")) return; const r = await sb.rpc("regen_join_code"); if (r.error) { alert(r.error.message); return; } shop.scode = r.data; renderTeam(); };
  el.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => { if (!confirm("ลบสมาชิกคนนี้ออกจากร้าน?")) return; const r = await sb.rpc("remove_member", { p_user: b.dataset.rm }); if (r.error) { alert(r.error.message); return; } renderTeam(); });
}

/* ---------- Edit / archive ---------- */
let editId = null;
function openEdit(id) {
  const i = allItems.find(x => x.id === id); if (!i) return; editId = id;
  $("#eName").value = i.name; $("#eSku").value = i.sku || ""; if (![...$("#eUnit").options].some(o => o.value === i.unit)) $("#eUnit").add(new Option(i.unit, i.unit)); $("#eUnit").value = i.unit; $("#eMin").value = i.min_qty; $("#eLoc").value = i.location || ""; $("#eE1").value = i.exp1 || ""; $("#eQ1").value = i.lot1_qty || 0; $("#eQ2").value = i.lot2_qty || 0; $("#eE2").value = i.exp2 || ""; $("#eErr").textContent = "";
  $("#eToggle").textContent = i.active === false ? "เปิดใช้งานอีกครั้ง" : "ปิดใช้งานสินค้า";
  $("#dEdit").showModal();
}
$("#eCancel").onclick = () => $("#dEdit").close();
async function saveEdit(patch) {
  $("#eOk").disabled = true; $("#eToggle").disabled = true;
  const { error } = await sb.from("items").update(patch).eq("id", editId);
  $("#eOk").disabled = false; $("#eToggle").disabled = false;
  if (error) { $("#eErr").textContent = error.message; return; }
  $("#dEdit").close(); load();
}
$("#eOk").onclick = () => {
  const name = $("#eName").value.trim();
  if (!name) { $("#eErr").textContent = "กรุณากรอกชื่อสินค้า"; return; }
  if (badDate($("#eE1").value) || badDate($("#eE2").value)) { $("#eErr").textContent = DATE_MSG; return; }
  const q1 = $("#eE1").value ? Math.max(0, Math.floor(+$("#eQ1").value || 0)) : 0, q2 = $("#eE2").value ? Math.max(0, Math.floor(+$("#eQ2").value || 0)) : 0, cur = allItems.find(x => x.id === editId);
  if (cur && q1 + q2 > cur.qty) { $("#eErr").textContent = "จำนวนสองล็อตรวมกัน (" + (q1 + q2) + ") เกินยอดคงเหลือ (" + cur.qty + ")"; return; }
  saveEdit({ name, sku: $("#eSku").value.trim() || null, unit: $("#eUnit").value.trim() || "ชิ้น", min_qty: Math.max(0, Math.floor(+$("#eMin").value || 0)), location: $("#eLoc").value.trim() || null, exp1: $("#eE1").value || null, exp2: $("#eE2").value || null, lot1_qty: q1, lot2_qty: q2 });
};
$("#eToggle").onclick = () => {
  const i = allItems.find(x => x.id === editId), on = i.active !== false;
  if (on && !confirm("ปิดใช้งานสินค้านี้? ประวัติยังอยู่ และเปิดกลับมาได้ภายหลัง")) return;
  saveEdit({ active: !on });
};

/* ---------- Export CSV ---------- */
function csvCell(v) {
  if (v === null || v === undefined) return "";
  let t = String(v);
  if (typeof v === "string" && /^[=+\-@\t\r]/.test(t)) t = "'" + t;
  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function downloadCSV(name, rows) {
  const text = "\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
$("#expStock").onclick = () => downloadCSV("stock-" + stamp() + ".csv",
  [["ชื่อสินค้า", "รหัส", "หน่วย", "คงเหลือ", "ขั้นต่ำ", "สถานะ", "การใช้งาน", "หมดอายุล็อต 1", "จำนวนล็อต 1", "หมดอายุล็อต 2", "จำนวนล็อต 2", "ตำแหน่ง"],
   ...allItems.map(i => [i.name, i.sku || "", i.unit, i.qty, i.min_qty, { ok: "ปกติ", low: "ใกล้หมด", out: "หมด" }[stat(i)], i.active === false ? "ปิด" : "ใช้งาน", i.exp1 || "", i.lot1_qty || 0, i.exp2 || "", i.lot2_qty || 0, i.location || ""])]);
$("#expLog").onclick = () => downloadCSV("stock-log-" + stamp() + ".csv",
  [["วันเวลา", "สินค้า", "ประเภท", "จำนวน(+/−)", "คงเหลือหลังทำรายการ", "ผู้ทำรายการ", "หมายเหตุ", "หมดอายุล็อตที่รับเข้า"],
   ...filteredLogs().map(l => [new Date(l.created_at).toLocaleString("th-TH"), l.item_name, tl(l.type), sgn(l) * l.qty, l.after_qty, l.by_name || l.by_email || "", l.note || "", l.exp || ""])]);

sb.auth.getSession().then(({ data }) => { if (!data.session) $("#login").hidden = false; });
</script>
